services:
  - type: web
    name: hiremate-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CREATE_DB_TABLES
        value: "true"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MYSQL_SSL_CA_PEM
        sync: false
